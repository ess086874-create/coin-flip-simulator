<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>基因工程载体构建模拟器（白底版）</title>
<style>
    body { font-family: 'Microsoft YaHei', sans-serif; background-color: #ffffff; color: #2c3e50; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; user-select: none; }
    h1 { color: #2980b9; margin-bottom: 5px; letter-spacing: 2px; }
    p.subtitle { color: #e74c3c; margin-top: 0; margin-bottom: 30px; font-weight: bold; }
    
    .game-area { display: flex; justify-content: center; margin-bottom: 40px; }
    
    /* 质粒容器，作为极坐标的中心 */
    .plasmid-container { position: relative; width: 440px; height: 440px; }
    
    /* 中间的骨架底色（浅灰色以适应白底） */
    .plasmid-ring {
        width: 300px; height: 300px;
        border: 24px solid #ecf0f1; 
        border-radius: 50%;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 4px 15px rgba(0,0,0,0.1);
    }

    /* 所有贴在环上的元件的通用样式 */
    .arc-item {
        position: absolute; width: 86px; height: 38px;
        top: 50%; left: 50%;
        margin-top: -19px; margin-left: -43px;
        display: flex; justify-content: center; align-items: center;
        font-size: 12px; font-weight: bold; color: #fff;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        border-radius: 6px;
        transform-origin: center center;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s;
    }

    /* 固定元件沿环排布 */
    .fixed-ori { background-color: #8e44ad; transform: rotate(240deg) translateY(-150px); }
    .fixed-marker { background-color: #e67e22; transform: rotate(120deg) translateY(-150px); }

    /* 三个空位首尾相连排布在上方 */
    .slot {
        border: 2px dashed #3498db;
        background-color: rgba(52, 152, 219, 0.1);
        color: #3498db;
        width: 90px;
    }
    .slot[data-slot="1"] { transform: rotate(-35deg) translateY(-150px); }
    .slot[data-slot="2"] { transform: rotate(0deg) translateY(-150px); }
    .slot[data-slot="3"] { transform: rotate(35deg) translateY(-150px); }
    
    .slot.empty::before { content: '插入位点'; opacity: 0.6; font-size: 11px;}
    .slot.filled { border: none; background: transparent; box-shadow: none;}

    /* 元件库区域 */
    .element-pool {
        display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;
        max-width: 800px; margin: 0 auto; padding: 20px;
        background-color: #f8f9fa; border-radius: 12px; border: 1px solid #e9ecef;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        min-height: 100px;
    }
    
    .element {
        padding: 10px 18px; border-radius: 20px; color: white; font-weight: bold;
        cursor: grab; user-select: none; font-size: 15px;
        box-shadow: 0 3px 6px rgba(0,0,0,0.15); 
        display: flex; align-items: center; gap: 8px;
        touch-action: none;
        position: relative;
        z-index: 10;
    }
    
    /* 箭头翻转动画 */
    .arrow { font-size: 18px; font-weight: 900; transition: transform 0.2s; }
    .reverse { transform: rotate(180deg); }
    
    /* 元件颜色 */
    .promoter { background-color: #e74c3c; } /* 红色：启动子 */
    .gene { background-color: #2ecc71; }     /* 绿色：目的基因 */
    .term { background-color: #3498db; }     /* 蓝色：终止子 */

    .btn-reset {
        margin-top: 20px; padding: 12px 30px; font-size: 16px;
        background-color: #ff9f43; color: white; border: none; border-radius: 20px;
        cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.2); font-weight: bold;
    }
    .hint { font-size: 14px; color: #7f8c8d; margin-top: 10px; }
</style>
</head>
<body>

    <h1>🧬 基因工程载体构建模拟器</h1>
    <p class="subtitle">拖拽元件至空位 / 单击元件可反转方向</p>

    <div class="game-area">
        <div class="plasmid-container">
            <div class="plasmid-ring">
                <div class="arc-item fixed-marker">抗性基因</div>
                <div class="arc-item fixed-ori">复制原点</div>
                
                <div class="arc-item slot empty" data-slot="1"></div>
                <div class="arc-item slot empty" data-slot="2"></div>
                <div class="arc-item slot empty" data-slot="3"></div>
            </div>
        </div>
    </div>

    <!-- 元件库 -->
    <div class="element-pool" id="pool">
        <!-- 启动子（红） -->
        <div class="element promoter" data-type="promoter" data-dir="1">
            <span class="arrow">➡</span> vtg 启动子
        </div>
        <!-- 目的基因（绿） -->
        <div class="element gene" data-type="gene" data-dir="1">
            <span class="arrow">➡</span> GFP 基因
        </div>
        <!-- 终止子（蓝） -->
        <div class="element term" data-type="term" data-dir="1">
            <span class="arrow">➡</span> 终止子
        </div>
        
        <!-- 干扰元件 -->
        <div class="element promoter" data-type="promoter" data-dir="1">
            <span class="arrow">➡</span> GFP 启动子
        </div>
        <div class="element gene" data-type="gene" data-dir="1">
            <span class="arrow">➡</span> vtg 基因
        </div>
    </div>

    <button class="btn-reset" onclick="resetGame()">重新开始</button>

<script>
    const elements = document.querySelectorAll('.element');
    const slots = document.querySelectorAll('.slot');
    const pool = document.getElementById('pool');
    
    let activeElement = null;
    let initialX, initialY;
    let currentX, currentY;
    let startX, startY;
    let isDragging = false;

    elements.forEach(el => {
        el.addEventListener('pointerdown', dragStart);
    });

    function dragStart(e) {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        activeElement = e.target.closest('.element');
        if (!activeElement) return;

        e.preventDefault(); 

        startX = e.clientX;
        startY = e.clientY;
        isDragging = false;

        const rect = activeElement.getBoundingClientRect();
        initialX = e.clientX - rect.left;
        initialY = e.clientY - rect.top;

        document.addEventListener('pointermove', dragMove);
        document.addEventListener('pointerup', dragEnd);
    }

    function dragMove(e) {
        if (!activeElement) return;

        if (!isDragging) {
            if (Math.hypot(e.clientX - startX, e.clientY - startY) > 5) {
                isDragging = true;
                
                if (activeElement.parentElement.classList.contains('slot')) {
                    let slot = activeElement.parentElement;
                    slot.classList.add('empty');
                    slot.classList.remove('filled');
                    pool.appendChild(activeElement);
                }

                const rect = activeElement.getBoundingClientRect();
                activeElement.style.position = 'fixed';
                activeElement.style.left = rect.left + 'px';
                activeElement.style.top = rect.top + 'px';
                activeElement.style.width = rect.width + 'px';
                activeElement.style.height = rect.height + 'px';
                activeElement.style.zIndex = '9999';
                activeElement.style.transform = 'none'; 
                activeElement.style.fontSize = '15px';
                activeElement.style.padding = '10px 18px';
                activeElement.style.borderRadius = '20px';
            }
        }

        if (isDragging) {
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
            activeElement.style.left = currentX + 'px';
            activeElement.style.top = currentY + 'px';
        }
    }

    function dragEnd(e) {
        if (!activeElement) return;
        
        document.removeEventListener('pointermove', dragMove);
        document.removeEventListener('pointerup', dragEnd);

        if (!isDragging) {
            toggleDirection(activeElement);
            if (activeElement.parentElement.classList.contains('slot')) {
                updateSlotRotation(activeElement);
            }
            activeElement = null;
            return;
        }

        let closestSlot = null;
        let minDistance = 70;

        slots.forEach(slot => {
            const slotRect = slot.getBoundingClientRect();
            const slotX = slotRect.left + slotRect.width / 2;
            const slotY = slotRect.top + slotRect.height / 2;
            
            const elRect = activeElement.getBoundingClientRect();
            const elX = elRect.left + elRect.width / 2;
            const elY = elRect.top + elRect.height / 2;
            
            const distance = Math.hypot(elX - slotX, elY - slotY);
            if (distance < minDistance) {
                minDistance = distance;
                closestSlot = slot;
            }
        });

        if (closestSlot) {
            if (closestSlot.classList.contains('filled')) {
                let oldEl = closestSlot.querySelector('.element');
                pool.appendChild(oldEl);
                resetElementStyle(oldEl);
            }
            
            closestSlot.classList.remove('empty');
            closestSlot.classList.add('filled');
            closestSlot.appendChild(activeElement);
            
            activeElement.style.position = 'relative';
            activeElement.style.left = 'auto';
            activeElement.style.top = 'auto';
            activeElement.style.width = '100%';
            activeElement.style.height = '100%';
            activeElement.style.fontSize = '12px';
            activeElement.style.padding = '0';
            activeElement.style.margin = '0';
            activeElement.style.borderRadius = '6px';
            
            updateSlotRotation(activeElement);

        } else {
            pool.appendChild(activeElement);
            resetElementStyle(activeElement);
        }
        
        activeElement = null;
    }

    function toggleDirection(el) {
        let dir = el.getAttribute('data-dir');
        let arrow = el.querySelector('.arrow');
        if (dir === '1') {
            el.setAttribute('data-dir', '-1');
            arrow.classList.add('reverse');
        } else {
            el.setAttribute('data-dir', '1');
            arrow.classList.remove('reverse');
        }
        
        if (!el.parentElement.classList.contains('slot')) {
            resetElementStyle(el);
        }
    }

    function updateSlotRotation(el) {
        let slotTransform = el.parentElement.style.transform;
        let angleMatch = slotTransform.match(/rotate\((-?\d+)deg\)/);
        let baseAngle = angleMatch ? parseInt(angleMatch[1]) : 0;
        
        let dir = el.getAttribute('data-dir');
        if (dir === '-1') {
            el.style.transform = `rotate(${baseAngle + 180}deg)`;
        } else {
            el.style.transform = 'none'; 
        }
    }

    function resetElementStyle(el) {
        el.style.position = 'relative';
        el.style.left = 'auto';
        el.style.top = 'auto';
        el.style.width = 'auto';
        el.style.height = 'auto';
        el.style.fontSize = '15px';
        el.style.padding = '10px 18px';
        el.style.margin = '0';
        el.style.zIndex = '10';
        el.style.borderRadius = '20px';
        
        let dir = el.getAttribute('data-dir');
        if(dir === '-1'){
             el.style.transform = 'rotate(180deg)';
        } else {
             el.style.transform = 'none';
        }
    }

    function resetGame() {
        elements.forEach(el => {
            pool.appendChild(el);
            el.setAttribute('data-dir', '1');
            el.querySelector('.arrow').classList.remove('reverse');
            resetElementStyle(el);
        });
        
        slots.forEach(slot => {
            slot.classList.remove('filled');
            slot.classList.add('empty');
            slot.innerHTML = '';
        });
    }
</script>
</body>
</html>
